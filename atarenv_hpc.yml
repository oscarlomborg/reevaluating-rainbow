name: atarenv

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

  # Scientific Python
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - statsmodels

  # Plotting
  - matplotlib
  - seaborn

  # Reinforcement learning
  - gymnasium

  # PyTorch
  - pytorch
  - torchvision
  - tensorboard

  # Image/video
  - opencv
  - imageio
  - imageio-ffmpeg
  - moviepy
  - ffmpeg
  - pillow

  # Jupyter / interactive Python
  - ipython
  - ipykernel

  # Utilities
  - tqdm
  - requests
  - cloudpickle
  - joblib

  - pip:
      - ale-py==0.12.1
      - minatar==1.0.15